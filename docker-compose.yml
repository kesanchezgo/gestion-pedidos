services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gestionpedidos
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: gestion-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion -d gestionpedidos"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # UI
      - "1025:1025"   # SMTP dev

volumes:
  pgdata:
