openapi: 3.1.0
info:
  title: API de pedidos — gestión-pedidos (feature 0001)
  version: 0.1.0
  description: >
    Contrato de la spec 0001-alta-pedido. Errores en formato ProblemDetail (RFC 7807)
    con `properties.errors` (mapa campo → mensaje). Servidor calcula siempre `total`.
servers:
  - url: http://localhost:8080/api
paths:
  /pedidos:
    post:
      operationId: crearPedido
      summary: Dar de alta un pedido (cliente + ≥1 línea)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoRequest' }
      responses:
        '201':
          description: Pedido creado con total calculado en servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoResponse' }
        '400':
          description: ProblemDetail con errores por campo (validación)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      operationId: listarPedidos
      summary: Listado paginado (orden cronológico descendente)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagePedidos' }
  /pedidos/{id}:
    get:
      operationId: obtenerPedido
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoResponse' }
        '404':
          description: ProblemDetail (pedido inexistente)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
components:
  schemas:
    LineaRequest:
      type: object
      required: [descripcion, cantidad, precioUnitario]
      properties:
        descripcion: { type: string, maxLength: 200 }
        cantidad: { type: integer, minimum: 1 }
        precioUnitario: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
    PedidoRequest:
      type: object
      required: [clienteNombre, clienteEmail, lineas]
      properties:
        clienteNombre: { type: string, maxLength: 120 }
        clienteEmail: { type: string, format: email }
        lineas:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineaRequest' }
        # total NO se acepta del cliente: el servidor lo calcula (FR-002)
    LineaResponse:
      type: object
      properties:
        id: { type: integer }
        descripcion: { type: string }
        cantidad: { type: integer }
        precioUnitario: { type: number }
    PedidoResponse:
      type: object
      properties:
        id: { type: integer }
        clienteNombre: { type: string }
        clienteEmail: { type: string }
        estado: { type: string, enum: [ABIERTO] }
        total: { type: number }
        creadoEn: { type: string, format: date-time }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaResponse' }
    PagePedidos:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/PedidoResponse' } }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      description: RFC 7807
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
